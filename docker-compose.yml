# Local stack: Vite dev server + Firebase Emulator Suite.
#
#   docker compose up            start both (Ctrl+C stops; add -d to run in the background)
#   http://localhost:5180        the app (hot reload: just save a file)
#   http://localhost:4000        Emulator UI (Firestore, Auth, Storage, Functions)
#
# Every write the app makes goes through the `act` Cloud Function on the
# Functions emulator (src/services/api.js); `functions-build` rebuilds its
# bundle of src/services (functions/lib/app.js) whenever a source file changes.
#
# The app talks to the emulators, never to the live project: the environment
# below overrides whatever .env says, and "demo-local" is a demo- project ID,
# which the Firebase SDKs refuse to send to production.

services:
  # --- React / Vite dev server ------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5180:5180"
    volumes:
      # Source is mounted, so edits hot-reload without rebuilding the image.
      - .:/app
      # node_modules stays in the container (Linux builds, not the Mac's).
      - /app/node_modules
    environment:
      NODE_ENV: development
      # Docker Desktop on macOS does not always forward file events into the
      # container; polling makes hot reload reliable.
      CHOKIDAR_USEPOLLING: "true"
      # APP_BACKEND=local docker compose up  → in-memory backend, emulators unused.
      VITE_BACKEND: ${APP_BACKEND:-firebase}
      VITE_USE_EMULATORS: "true"
      # APP_WRITE_PATH=direct docker compose up → the browser writes to the
      # emulators itself (open rules), bypassing `act`.
      VITE_WRITE_PATH: ${APP_WRITE_PATH:-functions}
      VITE_FIREBASE_PROJECT_ID: demo-local
      VITE_FIREBASE_API_KEY: demo-api-key
      VITE_FIREBASE_AUTH_DOMAIN: demo-local.firebaseapp.com
      VITE_FIREBASE_STORAGE_BUCKET: demo-local.appspot.com
      VITE_FIREBASE_APP_ID: demo-app-id
      VITE_FIREBASE_MESSAGING_SENDER_ID: ""
      VITE_FIREBASE_MEASUREMENT_ID: ""
    depends_on:
      emulators:
        condition: service_healthy

  # --- The service code bundled for the `act` Cloud Function -------------------
  functions-build:
    build:
      context: .
      dockerfile: Dockerfile
    # First run on a fresh clone installs functions/ dependencies, then watches.
    # CRs are stripped first: a Windows checkout may have given the script CRLF
    # line endings, which sh refuses ("set: illegal option -").
    command: ["sh", "-c", "tr -d '\\r' < scripts/functions/dev.sh | sh"]
    volumes:
      - .:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD", "sh", "-c", "test -f /app/functions/lib/app.js && test -d /app/functions/node_modules/firebase-admin"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 300s

  # --- Firebase Emulator Suite -------------------------------------------------
  emulators:
    build:
      context: .
      dockerfile: Dockerfile.emulators
    ports:
      - "4000:4000"   # Emulator UI
      - "4400:4400"   # Emulator hub
      - "4500:4500"   # UI log stream
      - "8080:8080"   # Firestore
      - "9150:9150"   # Firestore websocket (Emulator UI requests tab)
      - "9099:9099"   # Auth
      - "9199:9199"   # Storage
      - "5001:5001"   # Functions (act, claims, delivery — outbound mail and push are skipped here)
    volumes:
      - .:/app
    environment:
      # FIREBASE_CONFIG=firebase.json docker compose up  → load the real
      # firestore.rules / storage.rules (reads then need a real signed-in
      # account; the dev panel's personas are not Auth accounts).
      FIREBASE_CONFIG: ${FIREBASE_CONFIG:-emulator/firebase.json}
      # The Functions emulator reloads when functions/lib/app.js is rebuilt.
      # Docker Desktop on Windows (and sometimes macOS) does not pass file
      # events through the bind mount, so it polls, like the app does.
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      functions-build:
        condition: service_healthy
    # Forward Ctrl+C / docker stop to the CLI so --export-on-exit saves data.
    init: true
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4400/emulators"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
